<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Pulse Animation Keyframes -->
    <style>
      .pulse-node {
        animation: pulseNode 3s infinite ease-in-out;
      }
      .flow-line {
        stroke-dasharray: 8 12;
        animation: dashMove 20s linear infinite;
      }
      .flow-line-reverse {
        stroke-dasharray: 6 10;
        animation: dashMoveRev 15s linear infinite;
      }
      .floating-tag {
        animation: floatTag 6s ease-in-out infinite alternate;
      }
      .floating-tag-2 {
        animation: floatTag 7s ease-in-out infinite alternate-reverse;
      }
      .badge-glow {
        animation: glowPulse 4s infinite ease-in-out;
      }

      @keyframes dashMove {
        to { stroke-dashoffset: -200; }
      }
      @keyframes dashMoveRev {
        to { stroke-dashoffset: 200; }
      }
      @keyframes pulseNode {
        0%, 100% { r: 6; opacity: 0.6; }
        50% { r: 9; opacity: 1; filter: drop-shadow(0 0 6px #38bdf8); }
      }
      @keyframes floatTag {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
      @keyframes glowPulse {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.7; }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="360" rx="16" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Background Ambient Glows -->
  <circle cx="200" cy="100" r="180" fill="url(#glowGrad)" class="badge-glow"/>
  <circle cx="1050" cy="260" r="160" fill="url(#glowGrad)" class="badge-glow"/>

  <!-- Animated Pipeline DAG Grid / Background Lines -->
  <g opacity="0.4">
    <!-- Connecting DAG paths in background -->
    <path d="M 100 180 C 250 180, 280 90, 420 90 S 600 160, 750 160 S 950 80, 1100 80" 
          fill="none" stroke="url(#lineGrad)" stroke-width="2.5" class="flow-line"/>
    <path d="M 120 280 C 300 280, 380 230, 520 230 S 700 300, 880 300 S 1020 220, 1120 220" 
          fill="none" stroke="url(#lineGrad)" stroke-width="2" class="flow-line-reverse"/>
    <path d="M 420 90 L 520 230" fill="none" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5"/>
    <path d="M 750 160 L 880 300" fill="none" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5"/>

    <!-- Subtle DAG Nodes -->
    <circle cx="100" cy="180" r="6" fill="#0284c7" class="pulse-node"/>
    <circle cx="420" cy="90" r="7" fill="#38bdf8" class="pulse-node" style="animation-delay: 0.6s;"/>
    <circle cx="520" cy="230" r="6" fill="#818cf8" class="pulse-node" style="animation-delay: 1.2s;"/>
    <circle cx="750" cy="160" r="7" fill="#a855f7" class="pulse-node" style="animation-delay: 1.8s;"/>
    <circle cx="880" cy="300" r="6" fill="#38bdf8" class="pulse-node" style="animation-delay: 2.4s;"/>
    <circle cx="1100" cy="80" r="7" fill="#c084fc" class="pulse-node" style="animation-delay: 3s;"/>
  </g>

  <!-- Floating Feature Badges (Background / Decorative) -->
  <g class="floating-tag">
    <rect x="960" y="45" width="160" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.2" opacity="0.85"/>
    <text x="1040" y="67" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">⚡ DAG SCHEDULER</text>
  </g>

  <g class="floating-tag-2">
    <rect x="70" y="45" width="170" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.2" opacity="0.85"/>
    <text x="155" y="67" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#a855f7" text-anchor="middle">🔄 AUTO DEPENDENCY</text>
  </g>

  <g class="floating-tag">
    <rect x="940" y="275" width="180" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.2" opacity="0.85"/>
    <text x="1030" y="297" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#818cf8" text-anchor="middle">📊 ASSET OBSERVABILITY</text>
  </g>

  <g class="floating-tag-2">
    <rect x="80" y="275" width="170" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.2" opacity="0.85"/>
    <text x="165" y="297" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">🗄️ SQL DATA PIPELINES</text>
  </g>

  <!-- FOREGROUND CONTENT: Header, Title, Subtitle, Highlights (Guaranteed clear, crisp, and high-contrast) -->
  <g id="foreground-content">
    <!-- Top Pill / Category Label -->
    <rect x="425" y="55" width="350" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
    <circle cx="445" cy="71" r="5" fill="#10b981"/>
    <text x="605" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" letter-spacing="1" fill="#94a3b8" text-anchor="middle">
      CURATED DATA ENGINEERING ECOSYSTEM
    </text>

    <!-- Main Title -->
    <text x="600" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="url(#accentGrad)" text-anchor="middle" letter-spacing="-0.5">
      Scheduled SQL Task Orchestration
    </text>

    <!-- Subtitle / Tagline -->
    <text x="600" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="400" fill="#cbd5e1" text-anchor="middle">
      Modern Workflow Engines • Declarative Pipelines • High-Performance SQL DAGs
    </text>

    <!-- Secondary descriptive meta -->
    <text x="600" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="middle">
      Comparing Leading SaaS Platforms &amp; Star-Ranked Open-Source Engines
    </text>

    <!-- Bottom Feature Pills -->
    <g transform="translate(300, 255)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="180" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="90" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#38bdf8" text-anchor="middle">⏱️ Cron &amp; Sensor Triggers</text>

      <!-- Pill 2 -->
      <rect x="200" y="0" width="200" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="300" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#818cf8" text-anchor="middle">📐 Declarative DAG Workflows</text>

      <!-- Pill 3 -->
      <rect x="420" y="0" width="180" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="510" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#c084fc" text-anchor="middle">🔍 Lineage &amp; Observability</text>
    </g>
  </g>
</svg>
